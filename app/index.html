<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VendorGrocer | B2B Grocery Orders</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <section id="loginView" class="view active">
      <div class="auth-card">
        <h1>VendorGrocer</h1>
        <p>Restaurant & Vendor Grocery Ordering</p>
        <form id="loginForm">
          <label>
            Business Email
            <input type="email" id="email" placeholder="owner@restaurant.com" required />
          </label>
          <label>
            Password
            <input type="password" id="password" placeholder="••••••••" required />
          </label>
          <label>
            Role
            <select id="role" required>
              <option value="restaurant">Restaurant</option>
              <option value="vendor">Vendor</option>
            </select>
          </label>
          <button type="submit">Sign In</button>
        </form>
        <div class="demo-actions">
          <p>Quick demo access:</p>
          <button type="button" id="demoRestaurantBtn" class="ghost">Demo Restaurant</button>
          <button type="button" id="demoVendorBtn" class="ghost">Demo Vendor</button>
        </div>
      </div>
    </section>

    <section id="dashboardView" class="view">
      <header class="topbar">
        <div>
          <h2>Welcome, <span id="userName"></span></h2>
          <small id="userRole"></small>
        </div>
        <button id="logoutBtn" class="ghost">Logout</button>
      </header>

      <main class="layout">
        <section class="catalog">
          <h3>Available Grocery Items</h3>
          <div id="productGrid" class="grid"></div>
        </section>

        <aside class="cart-panel">
          <h3>Order Cart</h3>
          <ul id="cartItems"></ul>
          <div class="totals">
            <p>Subtotal: <strong id="subtotal">$0.00</strong></p>
            <button id="placeOrderBtn">Place Order</button>
          </div>
          <div id="orderMessage" class="message"></div>
        </aside>
      </main>

      <section class="orders">
        <h3>Recent Orders</h3>
        <table>
          <thead>
            <tr>
              <th>Order ID</th>
              <th>Date</th>
              <th>Items</th>
              <th>Status</th>
              <th>Total</th>
            </tr>
          </thead>
          <tbody id="orderTableBody"></tbody>
        </table>
      </section>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
